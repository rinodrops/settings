[workspace]
members = [".", "settings-schema"]
resolver = "2"

[package]
name = "settings"
version = "0.2.7"
edition = "2024"

[[bin]]
name = "settings"
path = "src/main.rs"

[dependencies]
settings-schema = { path = "settings-schema" }
eframe = "0.31"
egui = "0.31"
toml = "0.8"
toml_edit = "0.22"
serde = { version = "1", features = ["derive"] }
rfd = "0.15"
notify = "6"

# Native locale detection.
# macOS: NSLocale.preferredLanguages reflects the per-app override
#        (System Settings → Language & Region → Applications), then the
#        system-wide Preferred Languages list.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSLocale", "NSString"] }

# Windows: GetUserPreferredUILanguages returns the display language.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
strip = true

[build-dependencies]
settings-schema = { path = "settings-schema" }
winresource = "0.1"

# Xcode 27 beta: dyld rejects stripped proc-macro dylibs with "mis-aligned
# LINKEDIT string pool".  Disabling strip for build-override avoids the issue;
# proc-macros are compile-time only so this has no effect on the final binary.
[profile.release.build-override]
strip = false
